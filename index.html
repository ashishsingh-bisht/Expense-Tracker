<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>💰 Smart Expense Tracker</h1>

    <!-- Dashboard -->
    <div class="dashboard">
        <div class="card balance">
            <h3>Balance</h3>
            <h2 id="balance">₹0</h2>
        </div>

        <div class="card income">
            <h3>Income</h3>
            <h2 id="income">₹0</h2>
        </div>

        <div class="card expense">
            <h3>Expense</h3>
            <h2 id="expense">₹0</h2>
        </div>
    </div>

    <!-- Add Transaction -->
    <h3>Add Transaction</h3>

    <input type="text" id="text" placeholder="Description">

    <input type="number" id="amount" placeholder="Amount (+income / -expense)">

    <select id="category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
    </select>

    <input type="date" id="date">

    <button onclick="addTransaction()">Add</button>

    <!-- Search -->
    <h3>Search</h3>
    <input type="text" id="search" placeholder="Search transaction">

    <!-- Transactions -->
    <h3>Transactions</h3>
    <ul id="list"></ul>

    <!-- Chart -->
    <h3>Expense Analytics</h3>
    <canvas id="chart"></canvas>

    <!-- Export -->
    <button onclick="exportCSV()">Export CSV</button>

</div>

<!-- IMPORTANT: Always keep script at bottom -->
<script src="script.js"></script>

</body>
</html>
